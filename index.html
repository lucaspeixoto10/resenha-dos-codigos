<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Lanchonete</h1>

        <table>
            <tr>
                <th>Código do produto</th>
                <th>Preço do produto</th>
            </tr>
            <tr>
                <td>1</td>
                <td>R$ 5.00</td>
            </tr>
            <tr>
                <td>2</td>
                <td>R$ 3.50</td>
            </tr>
            <tr>
                <td>3</td>
                <td>R$ 4.80</td>
            </tr>
            <tr>
                <td>4</td>
                <td>R$ 8.90</td>
            </tr>
            <tr>
                <td>5</td>
                <td>R$ 7.32</td>
            </tr>
        </table>

        <label for="codigo">Codigo do produto comprado:</label>
        <input type="number" id="codigo" min="1" max="5">

        <label for="quantidade">Quantidade comprada:</label>
        <input type="number" id="quantidade" min="1">

        <button onclick="calcular()">Calcular</button>

        <p id="resultado"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
